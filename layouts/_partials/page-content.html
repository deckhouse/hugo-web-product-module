<div class="docs{{ with .Params.custom_class }} {{ . }}{{ end }}">
    <div class="docs__wrap-title">
        <h1 class="docs__title">{{ .Title }}</h1>
    </div>
    <div class="post-content">
        {{.Content}}
        {{ partial "page-navigation" . }}
        {{ partial "related-links" . }}
    </div>
   {{ if .IsSection }}
     {{ partial "section-index.html" . }}
   {{ end }}
</div>
